# retriever 环境 - 检索/RAG
# 使用方法:
#   conda env create -f retriever.yml
#   conda activate retriever
#   pip install torch==2.8.0 torchaudio==2.8.0 torchvision --index-url https://download.pytorch.org/whl/cu128
#
# 说明: PyTorch 通过 pip 单独安装以支持 CUDA 12.8 (conda pytorch 渠道没有 cu128 构建)
name: retriever
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - pip
  - setuptools
  - wheel
  # faiss-gpu 和 pyserini 依赖 (conda 安装更方便)
  - faiss-gpu>=1.8.0
  - openjdk=21
  - numpy<2.0.0
  - pip:
      # ---- PyTorch (通过 pip 安装 cu128 版本) ----
      # 运行: pip install torch==2.8.0 torchaudio==2.8.0 torchvision --index-url https://download.pytorch.org/whl/cu128
      #        (conda env create 不支持 --index-url, 需要手动执行上面这行)

      # ---- 检索核心 ----
      - pyserini==1.2.0
      - pyjnius==1.7.0
      - sentencepiece==0.2.1
      - tiktoken==0.12.0

      # ---- HuggingFace 生态 ----
      - transformers==4.57.3
      - tokenizers==0.22.2
      - datasets==4.4.2
      - huggingface-hub==0.36.0
      - safetensors==0.7.0
      - hf-xet==1.2.0

      # ---- 数据处理 ----
      - pandas==2.3.3
      - pyarrow==22.0.0
      - scikit-learn==1.7.2
      - scipy==1.15.3

      # ---- Web 服务 ----
      - fastapi==0.128.0
      - flask==3.1.2
      - uvicorn==0.40.0
      - httpx==0.28.1
      - pydantic==2.12.5
      - pydantic-settings==2.12.0

      # ---- LLM 客户端 ----
      - openai==2.15.0

      # ---- 推理 ----
      - onnxruntime==1.23.2

      # ---- 工具 ----
      - tqdm==4.67.1
      - python-dotenv==1.2.1
      - coloredlogs==15.0.1
      - nvidia-ml-py==13.580.82
      - nvitop==1.6.1
      - psutil==7.2.1
      - regex==2025.11.3
      - protobuf==6.33.3
      - dill==0.4.0
      - cython==3.2.4
